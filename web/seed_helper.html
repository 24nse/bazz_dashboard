<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>أداة إنشاء مجموعة المنتجات في Firebase lipsak-97e24</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-xl w-full bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">
        🔥
      </div>
      <h1 class="text-2xl font-bold">إنشاء مجموعة Products في Firebase</h1>
      <p class="text-slate-400 text-sm">المشروع: <span class="font-mono text-amber-400 font-bold">lipsak-97e24</span></p>
    </div>

    <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/60 text-xs space-y-2 font-mono text-slate-300">
      <div class="flex justify-between">
        <span class="text-slate-400">Database:</span>
        <span class="text-emerald-400">(default) Cloud Firestore</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">Collection:</span>
        <span class="text-amber-400 font-bold">products</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">Schema Format:</span>
        <span class="text-sky-400">Flat NoSQL (products)</span>
      </div>
    </div>

    <button id="btnSeed" onclick="seedProducts()" class="w-full py-3.5 px-6 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold transition-all shadow-lg shadow-amber-500/20 active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
      <span id="btnIcon">🚀</span>
      <span id="btnText">إضافة منتجات تجريبية إلى مجموعة products الآن</span>
    </button>

    <div id="logArea" class="hidden bg-black/60 p-4 rounded-2xl border border-slate-700 text-xs font-mono max-h-56 overflow-y-auto space-y-1 text-slate-300">
    </div>

    <div class="pt-4 border-t border-slate-700/60 flex items-center justify-between text-xs text-slate-400">
      <a href="https://console.firebase.google.com/project/lipsak-97e24/firestore" target="_blank" class="hover:text-amber-400 underline flex items-center gap-1">
        فتح Firebase Console ↗
      </a>
      <a href="/" class="hover:text-amber-400 underline">
        العودة للوحة التحكم
      </a>
    </div>
  </div>

  <script>
    const PROJECT_ID = 'lipsak-97e24';
    const COLLECTION = 'products';

    const products = [
      {
        storeId: 'store_01',
        vendorId: 'vendor_01',
        categoryId: 'women_dresses',
        topTab: 'women',
        title: 'فستان سهرة كريب راقي مطرز',
        description: 'فستان سهرة نسائي فاخر من الكريب الناعم وتطريز يدوي أنيق.',
        thumbnail: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500',
        images: ['https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500'],
        price: 299,
        salePrice: 239,
        saleLabel: 'خصم 20%',
        stock: 25,
        rating: 0.0,
        reviewsCount: 0,
        isFeatured: true,
        isActive: true
      },
      {
        storeId: 'store_01',
        vendorId: 'vendor_01',
        categoryId: 'men_shirts',
        topTab: 'men',
        title: 'قميص أكسفورد كلاسيكي فاخر',
        description: 'قميص رجالي فاخر من القطن الصافي 100% مناسب للمناسبات الرسمية والعمل.',
        thumbnail: 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500',
        images: ['https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500'],
        price: 189,
        salePrice: 149,
        saleLabel: 'خصم 21%',
        stock: 45,
        rating: 0.0,
        reviewsCount: 0,
        isFeatured: false,
        isActive: true
      }
    ];

    function toFields(obj) {
      const fields = {};
      for (const [k, v] of Object.entries(obj)) {
        if (typeof v === 'string') fields[k] = { stringValue: v };
        else if (typeof v === 'number') {
          if (Number.isInteger(v)) fields[k] = { integerValue: String(v) };
          else fields[k] = { doubleValue: v };
        }
        else if (typeof v === 'boolean') fields[k] = { booleanValue: v };
        else if (Array.isArray(v)) {
          fields[k] = { arrayValue: { values: v.map(item => ({ stringValue: String(item) })) } };
        }
      }
      fields.createdAt = { timestampValue: new Date().toISOString() };
      return { fields };
    }

    async function seedProducts() {
      const btn = document.getElementById('btnSeed');
      const text = document.getElementById('btnText');
      const logArea = document.getElementById('logArea');
      logArea.classList.remove('hidden');
      logArea.innerHTML = '<div class="text-amber-400">بدء الاتصال بـ Firestore...</div>';

      btn.disabled = true;
      text.textContent = 'جارٍ الحفظ...';

      for (const p of products) {
        try {
          const res = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/${COLLECTION}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(toFields(p))
          });
          const json = await res.json();
          if (res.ok) {
            const id = (json.name || '').split('/').pop();
            logArea.innerHTML += `<div class="text-emerald-400">✔ تم إنشاء المستند: "${p.Title}" (ID: ${id})</div>`;
          } else {
            logArea.innerHTML += `<div class="text-red-400">✖ خطأ: ${(json.error && json.error.message) || 'فشل الحفظ'}</div>`;
          }
        } catch (e) {
          logArea.innerHTML += `<div class="text-red-400">✖ خطأ شبكة: ${e.message}</div>`;
        }
      }

      logArea.innerHTML += '<div class="text-amber-300 font-bold pt-2">✨ انتهى! اذهب لـ Firebase Console واعمل Refresh للصفحة.</div>';
      btn.disabled = false;
      text.textContent = 'تم الإرسال - اضغط لإعادة المحاولة';
    }
  </script>
</body>
</html>
