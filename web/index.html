  <script>
    // GitHub Pages Base & Hash Route Handler
    (function() {
      var base = document.querySelector('base')?.getAttribute('href') || '/bazz_dashboard/';
      var cleanBase = base.endsWith('/') ? base.slice(0, -1) : base;

      // 1. If loaded with a hash (e.g. /#/add-product from direct link or 404.html redirect), restore route
      if (window.location.hash && window.location.hash.startsWith('#/')) {
        var route = window.location.hash.slice(1);
        window.history.replaceState(null, '', cleanBase + route + window.location.search);
      }

      // 2. Ensure all root-relative links respect base href without escaping to domain root
      document.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (!a) return;
        var href = a.getAttribute('href');
        if (href && href.startsWith('/') && !href.startsWith('//') && !href.startsWith(cleanBase)) {
          a.setAttribute('href', cleanBase + href);
        }
      }, true);
    })();
  </script>

  <!-- Firebase Initialization & Interop for project 'lipsak-97e24' -->
  <script>
    (function() {
      const STORAGE_KEY = 'firebase_lipsak_config';
      const defaultConfig = {
        apiKey: "",
        authDomain: "lipsak-97e24.firebaseapp.com",
        projectId: "lipsak-97e24",
        storageBucket: "lipsak-97e24.appspot.com",
        messagingSenderId: "764282864196",
        appId: ""
      };

      function loadConfig() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return Object.assign({}, defaultConfig, JSON.parse(saved));
        } catch (e) {
          console.warn("Failed to load saved Firebase config:", e);
        }
        return Object.assign({}, defaultConfig);
      }

      window.firebaseConfig = loadConfig();

      let db = null;
      function initFirebase() {
        try {
          if (window.firebaseConfig.apiKey) {
            if (!firebase.apps.length) {
              firebase.initializeApp(window.firebaseConfig);
            } else {
              firebase.app().delete().then(() => {
                firebase.initializeApp(window.firebaseConfig);
              });
            }
            db = firebase.firestore();
            console.log("Firebase SDK initialized for project:", window.firebaseConfig.projectId);
          } else {
            console.log("No Web API key configured yet. Direct REST API mode active for lipsak-97e24.");
          }
        } catch (err) {
          console.warn("Firebase SDK init warning (falling back to REST):", err);
        }
      }

      initFirebase();

      // Exposed for Dart interop
      window.getFirebaseConfig = function() {
        return JSON.stringify(window.firebaseConfig);
      };

      window.setFirebaseConfig = function(jsonStr) {
        try {
          const cfg = JSON.parse(jsonStr);
          window.firebaseConfig = Object.assign({}, window.firebaseConfig, cfg);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(window.firebaseConfig));
          initFirebase();
          return JSON.stringify({ success: true, projectId: window.firebaseConfig.projectId });
        } catch (e) {
          return JSON.stringify({ success: false, error: e.message });
        }
      };

      // Check if collection exists and has documents
      window.checkCollectionStatus = async function(colName) {
        const targetCol = colName || "Products";
        const projectId = window.firebaseConfig.projectId || "lipsak-97e24";

        if (db && window.firebaseConfig.apiKey) {
          try {
            const snap = await db.collection(targetCol).limit(1).get();
            return JSON.stringify({
              success: true,
              exists: !snap.empty,
              count: snap.size,
              collection: targetCol,
              projectId: projectId
            });
          } catch (e) {
            console.warn("SDK collection check failed, trying REST:", e);
          }
        }

        try {
          const restUrl = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${targetCol}?pageSize=1`;
          const resp = await fetch(restUrl);
          if (resp.ok) {
            const json = await resp.json();
            const docs = json.documents || [];
            return JSON.stringify({
              success: true,
              exists: docs.length > 0,
              count: docs.length,
              collection: targetCol,
              projectId: projectId
            });
          } else {
            const errJson = await resp.json().catch(() => ({}));
            return JSON.stringify({
              success: false,
              exists: false,
              error: (errJson.error && errJson.error.message) || resp.statusText,
              code: (errJson.error && errJson.error.status) || resp.status,
              collection: targetCol,
              projectId: projectId
            });
          }
        } catch (err) {
          return JSON.stringify({
            success: false,
            exists: false,
            error: err.message || String(err),
            collection: targetCol,
            projectId: projectId
          });
        }
      };

      function parseRestFields(fields) {
        const obj = {};
        if (!fields) return obj;
        for (const [k, v] of Object.entries(fields)) {
          if ('stringValue' in v) obj[k] = v.stringValue;
          else if ('integerValue' in v) obj[k] = parseInt(v.integerValue, 10);
          else if ('doubleValue' in v) obj[k] = parseFloat(v.doubleValue);
          else if ('booleanValue' in v) obj[k] = v.booleanValue;
          else if ('timestampValue' in v) obj[k] = v.timestampValue;
          else if ('arrayValue' in v) {
            const arr = (v.arrayValue && v.arrayValue.values) ? v.arrayValue.values : [];
            obj[k] = arr.map(item => {
              if ('stringValue' in item) return item.stringValue;
              if ('integerValue' in item) return parseInt(item.integerValue, 10);
              if ('doubleValue' in item) return parseFloat(item.doubleValue);
              if ('booleanValue' in item) return item.booleanValue;
              return item;
            });
          } else if ('nullValue' in v) {
            obj[k] = null;
          }
        }
        return obj;
      }

      function valueToRestField(val) {
        if (val === null || val === undefined) return { nullValue: null };
        if (typeof val === 'boolean') return { booleanValue: val };
        if (typeof val === 'number') {
          if (Number.isInteger(val)) return { integerValue: String(val) };
          return { doubleValue: val };
        }
        if (typeof val === 'string') {
          if (val === 'SERVER_TIMESTAMP') return { timestampValue: new Date().toISOString() };
          return { stringValue: val };
        }
        if (Array.isArray(val)) {
          return { arrayValue: { values: val.map(valueToRestField) } };
        }
        return { stringValue: String(val) };
      }

      // Add Product to Firestore (Strict flat schema: 'products' root collection)
      window.addProductToFirestore = async function(productJsonStr) {
        let productData = {};
        if (productJsonStr) {
          try {
            productData = JSON.parse(productJsonStr);
          } catch (_) {}
        }

        const targetCol = productData.collectionName || "products";
        const projectId = window.firebaseConfig.projectId || "lipsak-97e24";

        // Map strictly to the new flat NoSQL schema
        const cleanPayload = {
          storeId: String(productData.storeId || ""),
          vendorId: String(productData.vendorId || ""),
          categoryId: String(productData.categoryId || productData.category || "women_dresses"),
          topTab: String(productData.topTab || "women"),
          title: String(productData.title || productData.nameAr || productData.Name || "منتج جديد"),
          description: String(productData.description || ""),
          thumbnail: String(productData.thumbnail || productData.imageUrl || ""),
          images: Array.isArray(productData.images) && productData.images.length > 0 
            ? productData.images 
            : (productData.thumbnail ? [productData.thumbnail] : (productData.imageUrl ? [productData.imageUrl] : [])),
          price: parseFloat(productData.price) || 0.0,
          salePrice: parseFloat(productData.salePrice || productData.discountPrice) || 0.0,
          saleLabel: String(productData.saleLabel || ""),
          stock: parseInt(productData.stock, 10) || 0,
          rating: parseFloat(productData.rating) || 0.0,
          reviewsCount: parseInt(productData.reviewsCount, 10) || 0,
          isFeatured: productData.isFeatured === true,
          isActive: productData.isActive !== false
        };

        // If saleLabel is empty but salePrice < price, auto-calculate
        if (!cleanPayload.saleLabel && cleanPayload.salePrice > 0 && cleanPayload.salePrice < cleanPayload.price) {
          const discountPct = Math.round(((cleanPayload.price - cleanPayload.salePrice) / cleanPayload.price) * 100);
          cleanPayload.saleLabel = `خصم ${discountPct}%`;
        }

        // 1. Try Firebase Web SDK if API Key is configured
        if (db && window.firebaseConfig.apiKey) {
          try {
            cleanPayload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            const docRef = await db.collection(targetCol).add(cleanPayload);
            console.log(`Product added via SDK to ${targetCol} in ${projectId}. Doc ID:`, docRef.id);
            return JSON.stringify({
              success: true,
              id: docRef.id,
              collection: targetCol,
              projectId: projectId,
              via: "Firebase Web SDK",
              message: `تم حفظ المنتج بنجاح في مجموعة ${targetCol} بمشروع ${projectId}.`
            });
          } catch (sdkError) {
            console.warn("Firebase SDK save failed, attempting REST API fallback:", sdkError);
          }
        }

        // 2. Direct Firestore REST API (Works directly using Project ID)
        try {
          const restUrl = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${targetCol}`;
          const fields = {};
          for (const [k, v] of Object.entries(cleanPayload)) {
            fields[k] = valueToRestField(v);
          }
          fields.createdAt = { timestampValue: new Date().toISOString() };

          const restResp = await fetch(restUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fields })
          });

          const restJson = await restResp.json();
          if (restResp.ok) {
            const docPath = restJson.name || "";
            const docId = docPath.split("/").pop() || "new_doc";
            console.log(`Product added via REST API to ${targetCol} in ${projectId}. Doc ID:`, docId);
            return JSON.stringify({
              success: true,
              id: docId,
              collection: targetCol,
              projectId: projectId,
              via: "Firestore REST API",
              message: `تم حفظ المنتج بنجاح في مجموعة ${targetCol} بمشروع ${projectId}!`
            });
          } else {
            const errMsg = (restJson.error && restJson.error.message) || restResp.statusText;
            const errCode = (restJson.error && restJson.error.status) || restResp.status;
            return JSON.stringify({
              success: false,
              error: errMsg,
              code: errCode,
              projectId: projectId,
              collection: targetCol
            });
          }
        } catch (restErr) {
          return JSON.stringify({
            success: false,
            error: restErr.message || String(restErr),
            projectId: projectId,
            collection: targetCol
          });
        }
      };

      // Get Products from Firestore with optional storeId filtering
      window.getProductsFromFirestore = async function(colName, storeId) {
        let targetCol = colName || "products";
        const projectId = window.firebaseConfig.projectId || "lipsak-97e24";

        if (db && window.firebaseConfig.apiKey) {
          try {
            let colRef = db.collection(targetCol);
            let query = colRef;
            if (storeId && String(storeId).trim().length > 0) {
              query = query.where('storeId', '==', String(storeId).trim());
            }

            let snapshot = await query.get();
            // Fallback for transition if products collection is empty but old Products had items
            if (snapshot.empty && targetCol === "products" && !storeId) {
              const upperSnap = await db.collection("Products").get();
              if (!upperSnap.empty) {
                snapshot = upperSnap;
                targetCol = "Products";
              }
            }

            const items = [];
            snapshot.forEach((doc) => {
              const data = doc.data();
              data.id = doc.id;
              items.push(data);
            });
            return JSON.stringify({ success: true, products: items, collection: targetCol });
          } catch (e) {
            console.warn("SDK getProducts failed, falling back to REST:", e);
          }
        }

        try {
          const restUrl = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${targetCol}?pageSize=200`;
          const resp = await fetch(restUrl);
          if (resp.ok) {
            const json = await resp.json();
            const docs = json.documents || [];
            let items = docs.map((d) => {
              const parsed = parseRestFields(d.fields);
              parsed.id = (d.name || "").split("/").pop();
              return parsed;
            });

            if (storeId && String(storeId).trim().length > 0) {
              items = items.filter(it => it.storeId === String(storeId).trim());
            }

            return JSON.stringify({ success: true, products: items, collection: targetCol });
          } else {
            return JSON.stringify({ success: false, products: [], error: resp.statusText });
          }
        } catch (err) {
          return JSON.stringify({ success: false, products: [], error: err.message || String(err) });
        }
      };

      // Update Product in Firestore (Partial update: stock, price, salePrice, etc.)
      window.updateProductInFirestore = async function(docId, updatesJsonStr, colName) {
        if (!docId) return JSON.stringify({ success: false, error: "Document ID is required for update" });
        const targetCol = colName || "products";
        const projectId = window.firebaseConfig.projectId || "lipsak-97e24";
        let updates = {};
        try {
          updates = JSON.parse(updatesJsonStr);
        } catch (e) {
          return JSON.stringify({ success: false, error: "Invalid JSON updates: " + e.message });
        }

        if (db && window.firebaseConfig.apiKey) {
          try {
            await db.collection(targetCol).doc(docId).update(updates);
            return JSON.stringify({ success: true, id: docId, collection: targetCol, message: "تم تحديث المنتج بنجاح" });
          } catch (e) {
            console.warn("SDK updateProduct failed, trying REST:", e);
          }
        }

        try {
          const fieldKeys = Object.keys(updates);
          const maskParams = fieldKeys.map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
          const restUrl = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${targetCol}/${docId}?${maskParams}`;
          
          const fields = {};
          for (const [k, v] of Object.entries(updates)) {
            fields[k] = valueToRestField(v);
          }

          const resp = await fetch(restUrl, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fields })
          });

          if (resp.ok) {
            return JSON.stringify({ success: true, id: docId, collection: targetCol, message: "تم تحديث المنتج بنجاح عبر REST" });
          } else {
            const errJson = await resp.json().catch(() => ({}));
            return JSON.stringify({ success: false, error: (errJson.error && errJson.error.message) || resp.statusText });
          }
        } catch (err) {
          return JSON.stringify({ success: false, error: err.message || String(err) });
        }
      };

      // Delete Product from Firestore
      window.deleteProductFromFirestore = async function(docId, colName) {
        if (!docId) return JSON.stringify({ success: false, error: "Document ID is required for delete" });
        const targetCol = colName || "products";
        const projectId = window.firebaseConfig.projectId || "lipsak-97e24";

        if (db && window.firebaseConfig.apiKey) {
          try {
            await db.collection(targetCol).doc(docId).delete();
            return JSON.stringify({ success: true, id: docId, collection: targetCol, message: "تم حذف المنتج بنجاح" });
          } catch (e) {
            console.warn("SDK deleteProduct failed, trying REST:", e);
          }
        }

        try {
          const restUrl = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${targetCol}/${docId}`;
          const resp = await fetch(restUrl, { method: "DELETE" });
          if (resp.ok) {
            return JSON.stringify({ success: true, id: docId, collection: targetCol, message: "تم حذف المنتج بنجاح عبر REST" });
          } else {
            const errJson = await resp.json().catch(() => ({}));
            return JSON.stringify({ success: false, error: (errJson.error && errJson.error.message) || resp.statusText });
          }
        } catch (err) {
          return JSON.stringify({ success: false, error: err.message || String(err) });
        }
      };
    })();
  </script>
